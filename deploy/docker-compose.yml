services:
  news-panel:
    build:
      context: ..
      dockerfile: ${NEWS_PANEL_DOCKERFILE:-Dockerfile}
    image: ${NEWS_PANEL_IMAGE:-news-panel}:${NEWS_PANEL_TAG:-local}
    container_name: news-panel
    restart: unless-stopped
    ports:
      - "${NEWS_PANEL_BIND:-127.0.0.1}:${NEWS_PANEL_PORT:-8080}:8080"
    volumes:
      - news-panel-data:/data
    environment:
      FUSION_PASSWORD: ${FUSION_PASSWORD:?FUSION_PASSWORD must be set in .env}
      INGEST_TOKEN: ${INGEST_TOKEN:?INGEST_TOKEN must be set in .env}
      FUSION_LOG_LEVEL: ${FUSION_LOG_LEVEL:-INFO}
      FUSION_TRUSTED_PROXIES: ${FUSION_TRUSTED_PROXIES:-172.16.0.0/12}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_KEEP_MIN_SCORE: ${AI_KEEP_MIN_SCORE:-45}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      AI_FALLBACK_MODE: ${AI_FALLBACK_MODE:-keep_l1}
      AI_OPENAI_JSON_FORMAT: ${AI_OPENAI_JSON_FORMAT:-false}
      AI_CLI_COMMAND: ${AI_CLI_COMMAND:-}
      AI_CLI_ARGS: ${AI_CLI_ARGS:-}
      AI_CLI_COOLDOWN_SECONDS: ${AI_CLI_COOLDOWN_SECONDS:-0}
      AI_L1_FILTER_RETWEETS: ${AI_L1_FILTER_RETWEETS:-false}
      AI_TOPICS: ${AI_TOPICS:-}
      AI_L1_BLOCK_KEYWORDS: ${AI_L1_BLOCK_KEYWORDS:-}
      AI_L1_ALLOW_KEYWORDS: ${AI_L1_ALLOW_KEYWORDS:-}
      AI_HTTP_WRITE_TIMEOUT_SECONDS: ${AI_HTTP_WRITE_TIMEOUT_SECONDS:-480}
      AI_DECISION_ENABLED: ${AI_DECISION_ENABLED:-}
      AI_DECISION_PROVIDER: ${AI_DECISION_PROVIDER:-openai}
      AI_DECISION_BASE_URL: ${AI_DECISION_BASE_URL:-}
      AI_DECISION_API_KEY: ${AI_DECISION_API_KEY:-}
      AI_DECISION_AUTH_HEADER: ${AI_DECISION_AUTH_HEADER:-Authorization}
      AI_DECISION_MODEL: ${AI_DECISION_MODEL:-}
      AI_DECISION_ACCOUNT_ID: ${AI_DECISION_ACCOUNT_ID:-}
      AI_ALLOW_PRIVATE_ENDPOINTS: ${AI_ALLOW_PRIVATE_ENDPOINTS:-false}
      AI_DECISION_JSON_FORMAT: ${AI_DECISION_JSON_FORMAT:-false}
      AI_DECISION_TIMEOUT_SECONDS: ${AI_DECISION_TIMEOUT_SECONDS:-6}
      AI_DECISION_L3_PRIORITIES: ${AI_DECISION_L3_PRIORITIES:-critical,high,normal}
      AI_DECISION_LOW_ACTION: ${AI_DECISION_LOW_ACTION:-keep_unscored}
      AI_DECISION_FALLBACK_MODE: ${AI_DECISION_FALLBACK_MODE:-skip_to_l3}
      AI_RSS_MAX_ITEMS_PER_PULL: ${AI_RSS_MAX_ITEMS_PER_PULL:-20}
      CODEBUDDY_AUTH_TOKEN: ${CODEBUDDY_AUTH_TOKEN:-}
      CODEBUDDY_API_KEY: ${CODEBUDDY_API_KEY:-}
      CODEBUDDY_BASE_URL: ${CODEBUDDY_BASE_URL:-}
      CODEBUDDY_REMOTE_CONFIG_DISABLED: ${CODEBUDDY_REMOTE_CONFIG_DISABLED:-1}
      CODEBUDDY_DISABLE_TRACE_COLLECTOR: ${CODEBUDDY_DISABLE_TRACE_COLLECTOR:-1}
      CODEBUDDY_DISABLE_AUTO_MEMORY: ${CODEBUDDY_DISABLE_AUTO_MEMORY:-1}
      CODEBUDDY_DISABLE_GIT_PROMPT_CONTEXT: ${CODEBUDDY_DISABLE_GIT_PROMPT_CONTEXT:-1}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/oidc/enabled || curl -fsS http://127.0.0.1:8080/api/oidc/enabled >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: news-panel-caddy
    restart: unless-stopped
    depends_on:
      news-panel:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}

  x-twifork:
    build:
      context: ../plugins/x-twifork
      dockerfile: Dockerfile
    image: ${TWIFORK_IMAGE:-news-panel-x-twifork}:${TWIFORK_TAG:-local}
    container_name: news-panel-x-twifork
    restart: unless-stopped
    depends_on:
      news-panel:
        condition: service_healthy
    volumes:
      - ${TWIFORK_CONFIG:-./x-twifork.test.yaml}:/config/config.yaml:ro
      - x-twifork-data:/data
    environment:
      NEWS_PANEL_INGEST_TOKEN: ${INGEST_TOKEN:?INGEST_TOKEN must be set in .env}
      X_AUTH_TOKEN: ${X_AUTH_TOKEN:?X_AUTH_TOKEN must be set in .env}
      X_CT0: ${X_CT0:-}
      X_TWID: ${X_TWID:-}
      PLANNER_API_KEY: ${PLANNER_API_KEY:-}

volumes:
  news-panel-data:
  x-twifork-data:
  caddy-data:
  caddy-config:
