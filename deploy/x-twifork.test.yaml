# =====================================================================
# x-twifork 云端联调保守测试配置（低频 + 小批量，优先防风控与防 L2 超时）
# =====================================================================
source_id: x-twifork-main
source_type: x
impersonate: chrome124
log_level: INFO

core:
  base_url: http://news-panel:8080
  token: ${NEWS_PANEL_INGEST_TOKEN}
  timeout_seconds: 360
  ingest_max_retries: 3

cookies:
  auth_token: ${X_AUTH_TOKEN}
  ct0: ${X_CT0}
  twid: ${X_TWID}

fetch:
  poll_interval_seconds: 900
  jitter_seconds: 120
  max_delay_seconds: 7200
  quiet_hours: "01:00-08:30"
  quiet_hours_multiplier: 4.0
  timezone: "Asia/Shanghai"
  max_tweets_per_query: 10
  max_items_per_batch: 5
  search_product: "Latest"
  include_retweets: false
  first_run_max_items: 5
  pace_seconds: 3.0

backoff:
  initial_seconds: 60
  max_seconds: 3600
  multiplier: 2.0
  auth_backoff_seconds: 900
  auth_error_threshold: 3

accounts:
  - "@OpenAI"
  - "@AnthropicAI"

queries:
  - "OpenAI OR DeepSeek"
  - "VPS 优惠 OR 限免"

planner:
  enabled: false
